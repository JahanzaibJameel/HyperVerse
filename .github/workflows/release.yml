name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
        
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'pnpm'
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        echo "$STORE_PATH" >> $GITHUB_PATH
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Run tests
      run: pnpm test:coverage
      
    - name: Build for all platforms
      run: |
        pnpm build:ios
        pnpm build:android
        pnpm build:web
        
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from commits since last tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREV_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)")
        fi
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        body: |
          # HyperVerse ${{ github.ref_name }}
          
          ## 🚀 What's New
          ${{ steps.changelog.outputs.changelog }}
          
          ## 📱 Downloads
          - **iOS**: Download the IPA file below
          - **Android**: Download the APK file below  
          - **Web**: Access at https://hyperverse.app
          
          ## 🔧 Installation
          
          ### iOS
          1. Download the IPA file
          2. Install via AltStore or sideloading
          3. Trust the developer in Settings
          
          ### Android
          1. Download the APK file
          2. Enable "Install from unknown sources"
          3. Install the APK
          
          ### Web
          1. Visit https://hyperverse.app
          2. Install as PWA for offline access
          
          ## 📋 System Requirements
          - **iOS**: 14.0+ with ARM64 device
          - **Android**: API 30+ (Android 11+)
          - **Web**: Chrome 90+, Safari 14+, Firefox 88+
          
          ## 🔒 Privacy & Security
          - 100% offline-first architecture
          - No data leaves your device
          - Local AI processing only
          - Biometric authentication support
          
          ## 🤝 Contributing
          Want to contribute? Check out our [Contributing Guide](https://github.com/JahanzaibJameel/HyperVerse/blob/main/CONTRIBUTING.md)
          
          ---
          
          **Thank you for using HyperVerse! 🌟**
          
          *The sovereign life OS with on-device AI*
        files: |
          dist/ios/*.ipa
          dist/android/*.apk
          dist/web/**
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Notify Discord
      if: success()
      run: |
        curl -X POST -H 'Content-type: application/json' \
          --data '{"content":"🚀 HyperVerse ${{ github.ref_name }} has been released! Download now: https://github.com/JahanzaibJameel/HyperVerse/releases/tag/${{ github.ref_name }}"}' \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
