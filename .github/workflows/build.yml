name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build App
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9
        
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        # cache: 'pnpm' # Temporarily disabled to isolate issue
        
    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
        echo "$STORE_PATH" >> $GITHUB_PATH
        
    - name: Setup Expo CLI
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        token: ${{ secrets.EXPO_TOKEN }}
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Run type checking
      run: pnpm typecheck
      
    - name: Run linting
      run: pnpm lint
      
    - name: Build for iOS
      run: |
        if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
          expo build:ios --non-interactive --clear-cache
        else
          expo build:ios --non-interactive --clear-cache --release-channel production
        fi
        
    - name: Build for Android
      run: |
        if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
          expo build:android --non-interactive --clear-cache
        else
          expo build:android --non-interactive --clear-cache --release-channel production
        fi
        
    - name: Build for Web
      run: |
        if [ "$GITHUB_EVENT_NAME" == "pull_request" ]; then
          expo build:web --non-interactive --clear-cache
        else
          expo build:web --non-interactive --clear-cache --release-channel production
        fi
        
    - name: Upload iOS artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: dist/
        retention-days: 30
        
    - name: Upload Android artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: android-build
        path: dist/
        retention-days: 30
        
    - name: Upload Web artifacts
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: dist/
        retention-days: 30
        
    - name: Bundle analysis
      run: |
        echo "## Bundle Analysis"
        echo "### iOS Bundle Size"
        du -sh dist/ios/ || echo "N/A"
        echo "### Android Bundle Size"
        du -sh dist/android/ || echo "N/A"
        echo "### Web Bundle Size"
        du -sh dist/web/ || echo "N/A"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: ios-build
        path: ./ios-build
        
    - name: Download Android artifacts
      uses: actions/download-artifact@v8
      with:
        name: android-build
        path: ./android-build
        
    - name: Download Web artifacts
      uses: actions/download-artifact@v8
      with:
        name: web-build
        path: ./web-build
        
    - name: Deploy to Web Server
      run: |
        echo "Deploying web build to production server..."
        # Add your deployment commands here
        # Example: rsync -avz ./web-build/ user@server:/var/www/hyperverse/
        
    - name: Notify deployment
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment successful"
        else
          echo "❌ Deployment failed"
        fi
