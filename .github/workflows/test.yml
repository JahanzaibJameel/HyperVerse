name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # Caching disabled until GitHub cache services stabilise
          # cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `lint` is check-only, so a regression fails here rather than being
      # silently auto-fixed in CI.
      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

  audit:
    # Display name only — the job id stays `audit` so any branch-protection entry
    # or `needs:` reference keyed on the id keeps resolving. The rename is what
    # stops a green tick from reading as "audit passed".
    name: audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Table mode, not `--json`: in pnpm 9.15.0 `auditConfig.ignoreGhsas`
      # filters table output and the `Severity:` summary line but NOT
      # `.metadata.vulnerabilities` or the exit code. Running `--json` here
      # meant the 44-entry ignore list had no effect on CI's exit state.
      # `audit.txt` is a few KB, so `cat`-ing it is safe — the `--json` report
      # expands every dependency path and reached ~396 MB on this tree.
      #
      # `continue-on-error: true` is load-bearing and stays until the accepted
      # advisories are resolved. Without it this job cannot fail the pipeline,
      # so a green tick on this job means only that the job ran — which is why
      # the job is named `audit (advisory)` rather than `audit`. Triage is
      # tracked in docs/followups.md; once each accepted advisory is fixed or
      # retired, this flag comes off and the job gates for real.
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: |
          set +e
          pnpm audit --audit-level=high > audit.txt 2>&1
          code=$?
          cat audit.txt
          exit $code

      # Failure-only. A clean audit emits nothing: the accepted-advisory tally
      # is already on every run page via the `Severity:` line in the step log,
      # and restating it as an annotation each run read as "56 outstanding"
      # when all 56 are accepted.
      #
      # Reads `steps.audit.outcome`, not `conclusion` — with continue-on-error,
      # `conclusion` is rewritten to success and would always report "clean".
      - name: Audit summary
        if: always() && steps.audit.outcome == 'failure'
        run: |
          echo "::warning title=Dependency audit found new advisories::pnpm audit exited non-zero — high or critical advisories exist that are not in the ignoreGhsas list. Triage in docs/followups.md; add measured ignores to package.json."
