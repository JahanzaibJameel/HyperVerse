name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # Caching disabled until GitHub cache services stabilise
          # cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `lint` is check-only, so a regression fails here rather than being
      # silently auto-fixed in CI.
      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Coverage
        run: pnpm test:coverage

  audit:
    # Display name only — the job id stays `audit` so any branch-protection entry
    # or `needs:` reference keyed on the id keeps resolving. The rename is what
    # stops a green tick from reading as "audit passed".
    name: audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisory only: a high-severity advisory should not be able to block an
      # unrelated fix, but it must be visible on every run.
      #
      # `continue-on-error: true` is load-bearing and stays until the advisories
      # are triaged. Without it this job cannot fail the pipeline, so a green tick
      # on this job means only that the job ran — which is why the job is named
      # `audit (advisory)` rather than `audit`, and why the summary step below
      # restates the outcome as an explicit annotation. Triage is tracked in
      # docs/followups.md; once each advisory is fixed or formally accepted, this
      # flag comes off and the job gates for real.
      - name: Audit dependencies
        id: audit
        run: |
          set +e
          pnpm audit --audit-level=high --json > audit.json 2>/dev/null
          code=$?
          set -e
          echo "pnpm audit exited $code"
          exit $code
        continue-on-error: true

      # Restates the audit outcome as an annotation, including the severity
      # breakdown, so the run page carries the numbers rather than a bare
      # exit-code error.
      #
      # Reads `steps.audit.outcome`, not `conclusion`: with continue-on-error,
      # `conclusion` is rewritten to success and would always report "clean".
      #
      # `audit.json` is deliberately NOT cat'd. It expands every dependency path
      # and reached ~396 MB on this tree, which would flood the step log and slow
      # the job for no benefit — only `.metadata.vulnerabilities` is read here.
      - name: Summarise advisory findings
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          set -euo pipefail
          if [ ! -s audit.json ]; then
            echo "::error title=Dependency audit produced no JSON::pnpm audit --json wrote nothing, so severity counts are unknown. Treat this as a failed audit."
            exit 0
          fi
          counts=$(jq -r '.metadata.vulnerabilities |
            "\(.critical) critical, \(.high) high, \(.moderate) moderate, \(.low) low"' audit.json)
          total=$(jq -r '.advisories | length' audit.json)
          if [ "$AUDIT_OUTCOME" = "failure" ]; then
            echo "::warning title=Dependency audit found advisories::$total unique advisories — $counts. Advisory job: does not gate the pipeline. Full list in the 'Audit dependencies' step output; triage in docs/followups.md."
          else
            echo "::notice title=Dependency audit clean::No high or critical advisories ($counts)."
          fi
